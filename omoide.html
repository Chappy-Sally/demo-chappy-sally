<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>やさしい思い出ナビ｜Demo</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      font-family:"Hiragino Kaku Gothic ProN", sans-serif;
      text-align:center;
      background:#fff0f5;
      color:#6b4b2a;
      margin:0;
      padding:20px 12px 40px;
    }

    .omoide-img{
      width:90%;
      max-width:500px;
      border-radius:24px;
      margin:16px auto 22px;
      display:block;
      box-shadow:0 8px 18px rgba(0,0,0,0.12);
    }

    .main-card{
      width:94%;
      max-width:620px;
      margin:0 auto;
      padding:22px 16px 26px;
      background:rgba(255,255,255,0.94);
      border-radius:28px;
      box-shadow:0 6px 18px rgba(0,0,0,0.08);
    }

    h1{
      margin:0 0 12px;
      font-size:27px;
      line-height:1.45;
      color:#6b4b2a;
    }

    .desc{
      margin:0 auto 18px;
      font-size:16px;
      line-height:1.75;
      color:#7b5b39;
    }

    .soft-note,
    .demo-note{
  width:94%;
  max-width:520px;

  margin:18px auto;
  padding:16px 14px;

  background:
    linear-gradient(
      135deg,
      #fff3b8,
      #ffe6a8
    );

  border:2px solid #e6b85c;
  border-radius:20px;

  color:#7a5528;

  font-size:15px;
  font-weight:bold;
  line-height:1.8;

  box-shadow:
    0 5px 14px rgba(0,0,0,0.08);
    }

    .demo-note{
      margin-top:16px;
      background:#fff8fc;
    }

    .input-box{
      width:94%;
      max-width:520px;
      margin:14px auto 0;
      padding:17px 15px;
      background:#fffafd;
      border-radius:22px;
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
      text-align:left;
    }

    .input-title{
      margin-bottom:6px;
      font-size:18px;
      font-weight:bold;
      color:#6b4b2a;
      text-align:center;
    }

    .input-note{
      margin:0 0 14px;
      color:#947b67;
      font-size:14px;
      line-height:1.6;
      text-align:center;
    }

    .check-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .check-item{
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      gap:10px;
      width:100%;
      margin:0;
      padding:3px 0;
      color:#6b4b2a;
      font-size:16px;
      line-height:1.55;
      text-align:left;
    }

    .check-item input[type="checkbox"]{
      width:21px;
      height:21px;
      min-width:21px;
      max-width:21px;
      margin:2px 0 0;
      padding:0;
      flex:0 0 21px;
      accent-color:#a78ce5;
    }

    textarea{
      display:block;
      width:100%;
      min-height:130px;
      margin:12px auto 0;
      padding:14px 15px;
      border:2px solid #d7c5f3;
      border-radius:18px;
      background:white;
      color:#5b3a1e;
      font-family:inherit;
      font-size:16px;
      line-height:1.6;
      resize:none;
    }

    textarea[readonly]{
      background:#fff;
      opacity:1;
    }

    .button-group{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
    }

    button{
      min-width:190px;
      padding:14px 18px;
      border:none;
      border-radius:28px;
      color:white;
      font-size:16px;
      font-weight:bold;
      line-height:1.4;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    button:active{
      transform:scale(0.98);
    }

    .save-btn{
      background:linear-gradient(
        135deg,
        #c8afea,
        #a992e5,
        #8fa8e8
      );
    }

    .skip-btn{
      background:linear-gradient(
        135deg,
        #9dd8c7,
        #84cbb8
      );
    }

    .back-btn{
      background:linear-gradient(
        135deg,
        #ffbe73,
        #f6a65d
      );
    }

    .demo-stop{
      pointer-events:none;
      opacity:1;
      cursor:default;
    }

    @media(max-width:480px){
      h1{
        font-size:23px;
      }

      .desc{
        font-size:15px;
      }

      .check-item{
        font-size:15px;
      }

      button{
        width:100%;
        min-width:0;
        font-size:15px;
      }
    }
  </style>
</head>

<body>

  <div class="main-card">

    <h1>
      🌱 やさしい思い出ナビ 🌱
    </h1>

    <img
      src="https://raw.githubusercontent.com/Chappy-Sally/chappy-sally-images/main/covers/CS_omoide.png"
      class="omoide-img"
      alt="安心して思い出す時間"
    >

    <p class="desc">
      今の気持ちにつながるようなことを<br>
      もし思い出したら、教えてね😊
    </p>

    <div class="soft-note">
      無理に思い出さなくても大丈夫です🌿<br>
      話したくないことは、書かなくて大丈夫。<br>
      今のあなたが受け取れる範囲で十分だよ😊
    </div>

    <div class="demo-note">
      🌿 こちらは紹介用Demoです。<br>
      実際のワークの一部をご覧いただけます😊
    </div>

    <div class="input-box">

      <div class="input-title">
        思い当たるものはあるかな？
      </div>

      <p class="input-note">
        本番では、いくつ選んでも大丈夫です🌈
      </p>

      <div class="check-list">

        <label class="check-item demo-stop">
          <input
            type="checkbox"
            disabled
          >
          <span>
            子どもの頃のことで思い出したことがある
          </span>
        </label>

        <label class="check-item demo-stop">
          <input
            type="checkbox"
            disabled
          >
          <span>
            お父さんとのことで心に残っていることがある
          </span>
        </label>

      </div>

    </div>

    <div class="demo-note">
      本番では、このほかにも質問があります😊<br>
      思い出したことや、心に残っている言葉などを<br>
      やさしく見つけていきます🌿
    </div>

    <div class="input-box">

      <div class="input-title">
        思い出したことがあれば書いてね😊
      </div>

      <p class="input-note">
        まとまっていなくても、ひとことだけでも大丈夫です🌿
      </p>

      <textarea
        readonly
        placeholder="例：子どもの頃、よく「ちゃんとしなさい」と言われていた気がする"
      ></textarea>

    </div>

    <div class="button-group">

      <button
        class="save-btn demo-stop"
        type="button"
      >
        🌈 思い出したことを保存して<br>
        カードへ進む
      </button>

      <button
        class="skip-btn demo-stop"
        type="button"
      >
        🌿 今は思い出さないので<br>
        そのままカードへ進む
      </button>

    </div>

    <div class="button-group">

      <button
        class="back-btn"
        type="button"
        onclick="goBackMenu()"
      >
        🏠 メニューにもどる
      </button>

    </div>

  </div>

  <script>
    function goBackMenu(){

      const params =
        new URLSearchParams(window.location.search);

      const from =
        params.get("from");

      if(from === "set"){
        location.href =
          "anshin-set-menu.html";
      }else{
        location.href =
          "anshin-menu.html";
      }
    }
  </script>

</body>
</html>
