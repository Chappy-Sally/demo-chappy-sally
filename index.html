<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>チャッピー＆サリー｜デモンストレーション</title>

  <meta
    name="description"
    content="チャッピー＆サリーのアプリをご紹介するためのデモンストレーションページです。"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #6b4a3a;
      background:
        linear-gradient(
          180deg,
          #fffaf5 0%,
          #fff5ee 50%,
          #f8f5ff 100%
        );
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        16px
        calc(32px + env(safe-area-inset-bottom));
    }

    .main-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 28px;
      padding: 18px 16px 28px;
      box-shadow:
        0 10px 30px rgba(120, 90, 70, 0.10);
    }

    .hero-image {
      width: 100%;
      display: block;
      border-radius: 22px;
      box-shadow:
        0 6px 18px rgba(110, 80, 60, 0.10);
    }

    .lead {
      margin: 22px 0 26px;
      text-align: center;
      line-height: 1.9;
      font-size: 0.98rem;
    }

    .demo-list {
      display: grid;
      gap: 16px;
    }

    .demo-button {
      display: block;
      width: 100%;
      padding: 20px 16px;
      border-radius: 22px;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #6b4537;
      background: #fff2d9;
      border: 2px solid #f4d6a1;
      box-shadow:
        0 5px 14px rgba(110, 80, 60, 0.08);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .demo-button:nth-child(2) {
      background: #eaf7ed;
      border-color: #bee2c5;
    }

    .demo-button:nth-child(3) {
      background: #f1ecff;
      border-color: #d3c6f5;
    }

    .demo-button:active {
      transform: scale(0.98);
      box-shadow:
        0 2px 8px rgba(110, 80, 60, 0.08);
    }

    .demo-title {
      display: block;
      font-size: 1.12rem;
    }

    .demo-sub {
      display: block;
      margin-top: 5px;
      font-size: 0.86rem;
      font-weight: normal;
      color: #806d64;
    }

    .demo-description{
      text-align:center;
      line-height:1.9;
      margin:20px auto 22px;
    }

    .note {
      margin-top: 26px;
      padding: 16px;
      border-radius: 18px;
      background: #fffaf0;
      line-height: 1.8;
      font-size: 0.88rem;
      text-align: center;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: #9a8980;
    }

    @media (min-width: 600px) {
      .main-card {
        padding: 24px 24px 34px;
      }

      .lead {
        font-size: 1.02rem;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <main class="main-card">

      <img
        src="images/cs_Demo.png"
        alt="チャッピー＆サリー demoメニュー"
        class="hero-image"
      >

      <p class="lead">
  チャッピー＆サリーのアプリが<br>
  どんなものなのか、少しだけご紹介します😊
</p>

<div class="demo-description">

  🌿 こちらは紹介用の体験版Demoです😊<br>
  本番アプリの雰囲気を<br>
  少しだけ体験していただけます🌈<br><br>

  Demoでは、一部のボタンや入力は<br>
  動かないようになっています。<br><br>

  「ここは本番で使えるんだな〜😊」<br>
  くらいの気持ちでご覧ください。<br><br>

  気になるアプリをタップして<br>
  Demoをのぞいてみてね✨

</div>

<div class="demo-list">

  <a
    href="watashi-menu.html"
    class="demo-button"
  >
    <span class="demo-title">
      🌿 私にもどる対話ナビ
    </span>

    <span class="demo-sub">
      自分の気持ちにやさしく気づく時間
    </span>
  </a>

  <a
    href="anshin-menu.html"
    class="demo-button"
  >
    <span class="demo-title">
      🐶 安心にもどるナビ
    </span>

    <span class="demo-sub">
      モヤモヤや不安をやさしく整理する時間
    </span>
  </a>

  <a
    href="anshin-set-menu.html"
    class="demo-button"
  >
    <span class="demo-title">
      🌈 安心にもどるセット
    </span>

    <span class="demo-sub">
      ナビやチャッピーGPTをまとめてご紹介
    </span>
  </a>

</div>


      </div>


    </main>

    <footer>
      Chappy & Sally 🐾
    </footer>

  </div>

</body>
</html>
