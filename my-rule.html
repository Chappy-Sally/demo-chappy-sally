<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>私のマイルールを見てみよう｜デモ</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:22px 12px 40px;
      background:
        linear-gradient(
          180deg,
          #fff2f8 0%,
          #f8f2ff 50%,
          #eef7ff 100%
        );
      color:#6b4b2a;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      text-align:center;
    }

    .main-card{
      width:94%;
      max-width:640px;
      margin:0 auto;
      padding:24px 14px 30px;
      background:rgba(255,255,255,0.94);
      border-radius:28px;
      box-shadow:0 8px 22px rgba(0,0,0,0.08);
    }

    h1{
      margin:0 0 12px;
      color:#6b4b2a;
      font-size:27px;
      line-height:1.45;
    }

    .desc{
      margin:0 auto 20px;
      color:#7b6047;
      font-size:16px;
      line-height:1.8;
    }

    .demo-note{
      width:94%;
      max-width:540px;
      margin:0 auto 18px;
      padding:14px 16px;
      background:#fff8dc;
      border-radius:20px;
      color:#80684d;
      font-size:14px;
      line-height:1.75;
    }

    .question-box{
      width:94%;
      max-width:540px;
      margin:16px auto 0;
      padding:19px 16px;
      background:#fffdf9;
      border-radius:24px;
      box-shadow:0 5px 14px rgba(0,0,0,0.06);
      text-align:left;
    }

    .question-title{
      margin-bottom:8px;
      color:#6b4b2a;
      font-size:18px;
      font-weight:bold;
      line-height:1.65;
      text-align:center;
    }

    .question-note{
      margin:0 0 12px;
      color:#947b67;
      font-size:14px;
      line-height:1.7;
      text-align:center;
    }

    .check-list{
      display:grid;
      gap:10px;
      margin-top:12px;
    }

    .check-item{
      position:relative;
    }

    .check-item input{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .check-item span{
      display:flex;
      align-items:center;
      gap:11px;
      width:100%;
      padding:12px 14px;
      border:2px solid #f0dce8;
      border-radius:18px;
      background:#fff7fb;
      color:#74533c;
      font-size:15px;
      font-weight:bold;
      line-height:1.5;
    }

    .check-item span::before{
      content:"";
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      width:22px;
      height:22px;
      border:2px solid #d9afd0;
      border-radius:6px;
      background:#fff;
    }

    textarea{
      display:block;
      width:100%;
      min-height:100px;
      margin:12px auto 0;
      padding:14px 15px;
      border:2px solid #dccbf4;
      border-radius:19px;
      background:#fff;
      color:#5b3a1e;
      font-family:inherit;
      font-size:16px;
      line-height:1.65;
      resize:none;
    }

    .demo-stop{
      pointer-events:none;
      opacity:1;
      cursor:default;
    }

    .button-group{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
      margin-top:22px;
    }

    button{
      min-width:220px;
      padding:15px 20px;
      border:none;
      border-radius:28px;
      color:#fff;
      font-family:inherit;
      font-size:16px;
      font-weight:bold;
      line-height:1.45;
      box-shadow:0 5px 13px rgba(0,0,0,0.1);
    }

    .copy-btn{
      background:
        linear-gradient(
          135deg,
          #eda9ce,
          #b395e9,
          #849fe9
        );
    }

    .clear-btn{
      background:
        linear-gradient(
          135deg,
          #a8ddcd,
          #82cbb8
        );
    }

    .back-btn{
      background:
        linear-gradient(
          135deg,
          #ffbe73,
          #f6a65d
        );
      cursor:pointer;
    }

    .bottom-note{
      width:94%;
      max-width:540px;
      margin:20px auto 0;
      padding:13px 14px;
      color:#8a6d58;
      background:#fff8fc;
      border-radius:19px;
      font-size:13px;
      line-height:1.7;
    }

    @media(max-width:480px){
      h1{
        font-size:23px;
      }

      .desc{
        font-size:15px;
      }

      .question-title{
        font-size:17px;
      }

      .check-item span{
        padding:11px 12px;
        font-size:14px;
      }

      textarea{
        font-size:15px;
      }

      button{
        width:100%;
        min-width:0;
        font-size:15px;
      }
    }
  </style>
</head>

<body>

  <div class="main-card">

    <h1>
      🌿 私のマイルールを見てみよう 🌿
    </h1>

    <p class="desc">
      「ここがダメ」と思っていた自分から、<br>
      いつの間にか自分に決めていた<br>
      「こうあるべき」を見つけてみよう😊
    </p>

    <div class="demo-note">
      🌿 こちらは紹介用デモです。<br>
      実際のワークの一部をご覧いただけます😊
    </div>


    <!-- ①だけ表示 -->
    <div class="question-box">

      <div class="question-title">
        ① 私が「ここはダメかも」と<br>
        思っているところは？
      </div>

      <p class="question-note">
        本番では、近いものにチェックできます😊<br>
        複数選んでも大丈夫です🌿
      </p>

      <div class="check-list demo-stop">

        <label class="check-item">
          <input type="checkbox">
          <span>すぐ不安になる</span>
        </label>

        <label class="check-item">
          <input type="checkbox">
          <span>決めるのが遅い</span>
        </label>

        <label class="check-item">
          <input type="checkbox">
          <span>迷いやすい</span>
        </label>

        <label class="check-item">
          <input type="checkbox">
          <span>飽きっぽい</span>
        </label>

        <label class="check-item">
          <input type="checkbox">
          <span>人に頼るのが苦手</span>
        </label>

        <label class="check-item">
          <input type="checkbox">
          <span>頑張りすぎる</span>
        </label>

        <label class="check-item">
          <input type="checkbox">
          <span>自信がない</span>
        </label>

        <label class="check-item">
          <input type="checkbox">
          <span>人の目が気になる</span>
        </label>

      </div>

      <textarea
        class="demo-stop"
        readonly
        placeholder="ほかにもあれば自由に書いてね😊"
      ></textarea>

    </div>


    <div class="bottom-note">
      この先も質問に答えながら、<br>
      自分の中にあった「マイルール」に気づき、<br>
      やさしく見直していきます🌿
    </div>


    <!-- 本番にあるボタンを表示 -->
    <div class="button-group">

      <button
        class="copy-btn demo-stop"
        type="button"
      >
        🐶 チャッピーGPTに送る文章をコピー
      </button>

      <button
        class="clear-btn demo-stop"
        type="button"
      >
        🌿 入力を消す
      </button>

    </div>


    <div class="button-group">

      <button
        class="back-btn"
        type="button"
        onclick="location.href='watashi-menu.html'"
      >
        🏠 メニューにもどる
      </button>

    </div>

  </div>

</body>
</html>
