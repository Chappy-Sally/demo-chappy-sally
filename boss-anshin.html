<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>安心にもどるナビ｜デモ</title>

  <link
    rel="stylesheet"
    href="boss-anshin.css"
  >

  <style>
    /* =========================
       デモ専用
       見た目はそのままで操作だけ止める
    ========================= */

    .demo-stop{
      pointer-events:none !important;
      opacity:1 !important;
      cursor:default !important;
    }

    .demo-note{
      width:92%;
      max-width:540px;
      margin:0 auto 20px;
      padding:13px 15px;
      border-radius:18px;
      background:#fff8dc;
      color:#80684d;
      font-size:14px;
      line-height:1.75;
      text-align:center;
    }

    .demo-bottom-note{
      width:92%;
      max-width:540px;
      margin:18px auto 0;
      padding:14px 15px;
      border-radius:18px;
      background:#fff8fc;
      color:#8a6d58;
      font-size:14px;
      line-height:1.75;
      text-align:center;
    }

    /* readonlyでも本番っぽい見た目を維持 */
    input[readonly],
    textarea[readonly]{
      opacity:1;
      background:#fff;
    }
  </style>
</head>

<body>

  <div class="main-card">

    <div id="inputScreen">

      <h1>
        💫 安心にもどるナビ 💫
      </h1>

      <p class="desc">
        「でも」「どうせ」「無理かも」の奥にある気持ちを、<br>
        やさしく見つけて安心にもどるナビです😊
      </p>


      <div class="demo-note">
        🌿 こちらは紹介用デモです。<br>
        実際の画面や使い方の一部をご覧いただけます😊
      </div>


      <!-- どうなったら嬉しい？ -->
      <div class="input-box">

        <label for="theme">
          🌱 どうなったら嬉しい？
        </label>

        <input
          id="theme"
          class="demo-stop"
          type="text"
          readonly
          placeholder="例：私は○○になりたい🌈"
        >

      </div>


      <!-- 今の気持ち -->
      <div class="input-box">

        <div class="input-title">
          今の気持ちに近いものを選んでね🌿
        </div>

        <p class="input-note">
          本番では、いくつ選んでも大丈夫です😊
        </p>

        <div class="check-list demo-stop">

          <label class="check-item">
            <input
              type="checkbox"
              class="block-check"
            >
            <span>でも時間がない</span>
          </label>

          <label class="check-item">
            <input
              type="checkbox"
              class="block-check"
            >
            <span>でもお金がない</span>
          </label>

          <label class="check-item">
            <input
              type="checkbox"
              class="block-check"
            >
            <span>でも働きに行けない</span>
          </label>

          <label class="check-item">
            <input
              type="checkbox"
              class="block-check"
            >
            <span>どうせ私には無理</span>
          </label>

          <label class="check-item">
            <input
              type="checkbox"
              class="block-check"
            >
            <span>どうせ変わらない</span>
          </label>

          <label class="check-item">
            <input
              type="checkbox"
              class="block-check"
            >
            <span>失敗したくない</span>
          </label>

        </div>

      </div>


      <!-- 自由入力 -->
      <div class="input-box">

        <label for="customBlocks">
          自分の言葉も書けます😊
        </label>

        <textarea
          id="customBlocks"
          class="demo-stop"
          readonly
          placeholder="例：採用されない気がする。家でできる仕事が見つからない。"
        ></textarea>

      </div>


      <!-- 思い出ナビ -->
      <div class="memory-link-box">

        <div class="memory-link-title">
          🌱 もし思い出したことがあれば
        </div>

        <div class="memory-link-text">
          子どもの頃や家族のことなど、<br>
          今の気持ちにつながることを<br>
          やさしく振り返れます😊
          <br><br>
          思い出さなくても大丈夫です🌿
        </div>

        <button
          class="memory-btn demo-stop"
          type="button"
        >
          やさしい思い出ナビへ🌱
        </button>

      </div>


      <!-- カード -->
      <div class="draw-area">

        <div class="draw-title">
          🌿 安心にもどるカードを引く
        </div>

        <p class="draw-note">
          本番では、今の気持ちに合う枚数を選べます😊
        </p>

        <div class="draw-buttons">

          <button
            class="boss-btn demo-stop"
            type="button"
          >
            1枚
          </button>

          <button
            class="boss-btn demo-stop"
            type="button"
          >
            3枚
          </button>

        </div>

      </div>


      <div class="demo-bottom-note">
        本番では、入力した気持ちをもとにカードを引き、<br>
        チャッピーGPTとの対話へつなげていきます🐶🌈
      </div>


      <!-- 戻るだけ動く -->
      <div class="button-group">

        <button
          class="back-btn"
          type="button"
          onclick="goBackMenu()"
        >
          🏠 メニューにもどる
        </button>

      </div>

    </div>

  </div>


  <script>
    function goBackMenu(){

      const params =
        new URLSearchParams(
          window.location.search
        );

      const from =
        params.get("from");

      if(from === "set"){
        location.href =
          "anshin-set-menu.html";
      }else{
        location.href =
          "anshin-menu.html";
      }
    }
  </script>

</body>
</html>
